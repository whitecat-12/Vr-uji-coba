<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AR Galaxy</title>
  <style>
    body { 
      margin: 0; 
      overflow: hidden; 
      background-color: #000;
    }
    canvas { 
      display: block; 
    }
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: Arial, sans-serif;
      font-size: 18px;
    }
    .info-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 5px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      max-width: 250px;
      display: none;
    }
    .ar-button {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      background: rgba(0, 150, 255, 0.8);
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      z-index: 1000;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div class="loading">Loading AR Galaxy...</div>
  <div class="info-panel" id="infoPanel"></div>
  <script type="module">
    // Import Three.js dari CDN - menggunakan versi yang lebih spesifik
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js';
    
    // Import untuk WebXR
    import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/webxr/ARButton.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/loaders/GLTFLoader.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/controls/OrbitControls.js';

    // Scene + Camera
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 5);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.xr.enabled = true;
    renderer.outputEncoding = THREE.sRGBEncoding;
    document.body.appendChild(renderer.domElement);

    // Controls untuk mode non-AR
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Remove loading text
    document.querySelector('.loading').remove();

    // AR Button
    const arButton = ARButton.createButton(renderer, { 
      requiredFeatures: ['hit-test'] 
    });
    arButton.className = 'ar-button';
    document.body.appendChild(arButton);

    // GLTF Loader
    const loader = new GLTFLoader();

    // Planet configuration dengan fallback ke sphere jika model tidak ada
    const planets = [
      { 
        name: 'Mercury', 
        modelPath: 'models/mercury.glb',
        fallbackColor: 0x8c8c8c,
        scale: 0.3, 
        distance: 2.5, 
        speed: 0.02,
        info: 'Planet terkecil di tata surya. Diameter: 4,879 km'
      },
      { 
        name: 'Venus', 
        modelPath: 'models/venus.glb',
        fallbackColor: 0xe6b87e,
        scale: 0.5, 
        distance: 4.0, 
        speed: 0.015,
        info: 'Planet terpanas dengan atmosfer tebal. Suhu: 462°C'
      },
      { 
        name: 'Earth', 
        modelPath: 'models/earth.glb',
        fallbackColor: 0x6b93d6,
        scale: 0.5, 
        distance: 5.5, 
        speed: 0.01,
        info: 'Planet biru dengan kehidupan. 71% permukaan air'
      },
      { 
        name: 'Mars', 
        modelPath: 'models/mars.glb',
        fallbackColor: 0xc1440e,
        scale: 0.4, 
        distance: 7.0, 
        speed: 0.008,
        info: 'Planet merah dengan gunung tertinggi. Olympus Mons: 21 km'
      },
      { 
        name: 'Jupiter', 
        modelPath: 'models/jupiter.glb',
        fallbackColor: 0xc19e6b,
        scale: 1.0, 
        distance: 9.0, 
        speed: 0.005,
        info: 'Planet terbesar dengan Badai Merah Raksasa. Diameter: 142,984 km'
      },
      { 
        name: 'Saturn', 
        modelPath: 'models/saturn.glb',
        fallbackColor: 0xe3d2a6,
        scale: 0.9, 
        distance: 11.0, 
        speed: 0.003,
        info: 'Planet dengan cincin yang indah. Cincin terbuat dari es dan batu'
      }
    ];

    const planetMeshes = [];
    let sun = null;
    let isInAR = false;

    // Function untuk membuat planet fallback
    function createFallbackPlanet(planetConfig) {
      const geometry = new THREE.SphereGeometry(planetConfig.scale, 32, 32);
      const material = new THREE.MeshStandardMaterial({ 
        color: planetConfig.fallbackColor,
        roughness: 0.8,
        metalness: 0.2
      });
      const mesh = new THREE.Mesh(geometry, material);
      
      const angle = Math.random() * Math.PI * 2;
      mesh.position.x = Math.cos(angle) * planetConfig.distance;
      mesh.position.z = Math.sin(angle) * planetConfig.distance;
      
      mesh.userData = {
        name: planetConfig.name,
        originalDistance: planetConfig.distance,
        speed: planetConfig.speed,
        angle: angle,
        info: planetConfig.info,
        originalScale: planetConfig.scale,
        isScaled: false,
        isFallback: true
      };
      
      scene.add(mesh);
      planetMeshes.push(mesh);
      console.log(`Created fallback for: ${planetConfig.name}`);
      
      return Promise.resolve();
    }

    // Function untuk load planet model
    function loadPlanetModel(planetConfig) {
      return new Promise((resolve, reject) => {
        // Coba load model GLB
        loader.load(
          planetConfig.modelPath,
          (gltf) => {
            const model = gltf.scene;
            model.scale.setScalar(planetConfig.scale);
            
            const angle = Math.random() * Math.PI * 2;
            model.position.x = Math.cos(angle) * planetConfig.distance;
            model.position.z = Math.sin(angle) * planetConfig.distance;
            
            model.userData = {
              name: planetConfig.name,
              originalDistance: planetConfig.distance,
              speed: planetConfig.speed,
              angle: angle,
              info: planetConfig.info,
              originalScale: planetConfig.scale,
              isScaled: false,
              isFallback: false
            };
            
            scene.add(model);
            planetMeshes.push(model);
            console.log(`Loaded: ${planetConfig.name}`);
            resolve();
          },
          undefined,
          (error) => {
            console.warn(`Failed to load ${planetConfig.name}, using fallback:`, error.message);
            // Gunakan fallback
            createFallbackPlanet(planetConfig).then(resolve);
          }
        );
      });
    }

    // Create galaxy
    async function createGalaxy() {
      // Central Star (Sun)
      const sunGeometry = new THREE.SphereGeometry(1, 64, 64);
      const sunMaterial = new THREE.MeshBasicMaterial({ 
        color: 0xffcc00,
        emissive: 0xffaa00,
        emissiveIntensity: 0.8
      });
      sun = new THREE.Mesh(sunGeometry, sunMaterial);
      scene.add(sun);

      // Add glow effect to sun
      const sunGlowGeometry = new THREE.SphereGeometry(1.3, 32, 32);
      const sunGlowMaterial = new THREE.MeshBasicMaterial({
        color: 0xff9900,
        transparent: true,
        opacity: 0.3,
        side: THREE.BackSide
      });
      const sunGlow = new THREE.Mesh(sunGlowGeometry, sunGlowMaterial);
      sun.add(sunGlow);

      // Load all planets
      const loadPromises = planets.map(planet => loadPlanetModel(planet));
      await Promise.all(loadPromises);

      // Background stars
      const starCount = 2000;
      const starsGeometry = new THREE.BufferGeometry();
      const starPositions = new Float32Array(starCount * 3);
      const starSizes = new Float32Array(starCount);
      
      for (let i = 0; i < starCount; i++) {
        const i3 = i * 3;
        // Random position in a sphere
        const radius = 50;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        
        starPositions[i3] = radius * Math.sin(phi) * Math.cos(theta);
        starPositions[i3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
        starPositions[i3 + 2] = radius * Math.cos(phi);
        
        starSizes[i] = Math.random() * 2;
      }
      
      starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
      starsGeometry.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
      
      const starsMaterial = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.1,
        sizeAttenuation: true,
        transparent: true
      });
      
      const stars = new THREE.Points(starsGeometry, starsMaterial);
      scene.add(stars);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);

      const sunLight = new THREE.PointLight(0xffcc00, 2, 100);
      sun.add(sunLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(10, 10, 5);
      scene.add(directionalLight);

      console.log('Galaxy created successfully!');
      return { sun, planetMeshes, stars };
    }

    // Raycaster untuk interaksi
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let selectedPlanet = null;

    // Handle click/tap
    function onDocumentClick(event) {
      if (isInAR) return; // Jangan handle click di mode AR
      
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(planetMeshes);
      
      if (intersects.length > 0) {
        const planet = intersects[0].object;
        
        // Reset previous selection
        if (selectedPlanet && selectedPlanet !== planet) {
          selectedPlanet.scale.setScalar(selectedPlanet.userData.originalScale);
          selectedPlanet.userData.isScaled = false;
        }
        
        // Toggle scale
        if (planet.userData.isScaled) {
          planet.scale.setScalar(planet.userData.originalScale);
          planet.userData.isScaled = false;
          document.getElementById('infoPanel').style.display = 'none';
          selectedPlanet = null;
        } else {
          planet.scale.setScalar(planet.userData.originalScale * 1.5);
          planet.userData.isScaled = true;
          document.getElementById('infoPanel').style.display = 'block';
          document.getElementById('infoPanel').innerHTML = `
            <strong>${planet.userData.name}</strong><br>
            ${planet.userData.info}
          `;
          selectedPlanet = planet;
        }
      } else {
        // Clicked on empty space
        if (selectedPlanet) {
          selectedPlanet.scale.setScalar(selectedPlanet.userData.originalScale);
          selectedPlanet.userData.isScaled = false;
          document.getElementById('infoPanel').style.display = 'none';
          selectedPlanet = null;
        }
      }
    }

    // Create galaxy
    await createGalaxy();

    // Add event listeners
    window.addEventListener('click', onDocumentClick, false);
    window.addEventListener('resize', onWindowResize);

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      
      if (!isInAR) {
        controls.update();
      }
      
      // Rotate sun
      if (sun) sun.rotation.y += 0.005;
      
      // Animate planets in orbit
      planetMeshes.forEach(planet => {
        planet.userData.angle += planet.userData.speed;
        planet.position.x = Math.cos(planet.userData.angle) * planet.userData.originalDistance;
        planet.position.z = Math.sin(planet.userData.angle) * planet.userData.originalDistance;
        
        // Rotate planet
        planet.rotation.y += 0.01;
      });
      
      renderer.render(scene, camera);
    }

    // Handle XR session changes
    renderer.xr.addEventListener('sessionstart', () => {
      console.log('AR session started');
      isInAR = true;
      document.getElementById('infoPanel').style.display = 'none';
      
      // Reset planet scales saat masuk AR
      planetMeshes.forEach(planet => {
        planet.scale.setScalar(planet.userData.originalScale);
        planet.userData.isScaled = false;
      });
      selectedPlanet = null;
    });

    renderer.xr.addEventListener('sessionend', () => {
      console.log('AR session ended');
      isInAR = false;
    });

    // Start animation
    animate();
  </script>
</body>
</html>
