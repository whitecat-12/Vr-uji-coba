<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AR Galaxy with 3D Models</title>
  <style>
    body { 
      margin: 0; 
      overflow: hidden; 
      background-color: #000;
    }
    canvas { 
      display: block; 
    }
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: Arial, sans-serif;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="loading">Loading AR Galaxy...</div>
<script type="module">
  import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165/build/three.module.js';
  import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.165/examples/jsm/webxr/ARButton.js';
  import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.165/examples/jsm/loaders/GLTFLoader.js';

  // Scene + Camera
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera();

  // Renderer
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  // AR Button
  document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

  // GLTF Loader
  const loader = new GLTFLoader();

  // Store planet models
  const planetModels = [];
  const planetObjects = [];

  // Planet configurations
  const planets = [
    { name: 'sun', file: 'matahari.glb', scale: 0.15, distance: 0, speed: 0.005, rotationSpeed: 0.005 },
    { name: 'mercury', file: 'merkurius.glb', scale: 0.03, distance: 0.25, speed: 0.02, rotationSpeed: 0.01 },
    { name: 'venus', file: 'venus.glb', scale: 0.05, distance: 0.4, speed: 0.015, rotationSpeed: 0.008 },
    { name: 'earth', file: 'bumi.glb', scale: 0.05, distance: 0.55, speed: 0.01, rotationSpeed: 0.01 },
    { name: 'mars', file: 'mars.glb', scale: 0.04, distance: 0.7, speed: 0.008, rotationSpeed: 0.01 },
    { name: 'jupiter', file: 'jupiter.glb', scale: 0.1, distance: 0.9, speed: 0.005, rotationSpeed: 0.008 },
    { name: 'saturn', file: 'saturnus.glb', scale: 0.09, distance: 1.1, speed: 0.003, rotationSpeed: 0.006 }
  ];

  // Loading manager
  let loadedModels = 0;
  const loadingText = document.querySelector('.loading');

  function updateLoadingText() {
    loadedModels++;
    const percentage = Math.round((loadedModels / planets.length) * 100);
    loadingText.textContent = `Loading AR Galaxy... ${percentage}%`;
    
    if (loadedModels === planets.length) {
      setTimeout(() => {
        loadingText.remove();
        console.log('All models loaded successfully!');
      }, 500);
    }
  }

  // Load all planet models
  planets.forEach((planet, index) => {
    loader.load(
      planet.file,
      (gltf) => {
        const model = gltf.scene;
        model.scale.set(planet.scale, planet.scale, planet.scale);
        
        // Store the model
        planetModels.push({
          model: model,
          config: planet,
          angle: Math.random() * Math.PI * 2
        });
        
        updateLoadingText();
      },
      (progress) => {
        // Optional: show loading progress
        // console.log(`Loading ${planet.name}: ${(progress.loaded / progress.total * 100).toFixed(2)}%`);
      },
      (error) => {
        console.error(`Error loading ${planet.file}:`, error);
        
        // Create fallback sphere if model fails to load
        const fallbackGeometry = new THREE.SphereGeometry(planet.scale, 32, 32);
        const fallbackMaterial = new THREE.MeshStandardMaterial({ 
          color: getFallbackColor(planet.name) 
        });
        const fallbackMesh = new THREE.Mesh(fallbackGeometry, fallbackMaterial);
        
        planetModels.push({
          model: fallbackMesh,
          config: planet,
          angle: Math.random() * Math.PI * 2
        });
        
        updateLoadingText();
      }
    );
  });

  // Fallback colors for planets if models fail to load
  function getFallbackColor(planetName) {
    const colors = {
      'sun': 0xffcc00,
      'mercury': 0x8c8c8c,
      'venus': 0xe6b87e,
      'earth': 0x6b93d6,
      'mars': 0xc1440e,
      'jupiter': 0xc19e6b,
      'saturn': 0xe3d2a6
    };
    return colors[planetName] || 0xffffff;
  }

  // Create galaxy once all models are loaded
  function createGalaxy() {
    planetModels.forEach((planetData) => {
      const model = planetData.model.clone();
      const config = planetData.config;
      
      // Position planets in orbit (except sun which is at center)
      if (config.name !== 'sun') {
        model.position.x = config.distance;
        model.position.z = -0.8;
        
        // Add orbit visualization (optional)
        const orbitGeometry = new THREE.RingGeometry(config.distance - 0.02, config.distance + 0.02, 64);
        const orbitMaterial = new THREE.MeshBasicMaterial({
          color: 0x444444,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.3
        });
        const orbit = new THREE.Mesh(orbitGeometry, orbitMaterial);
        orbit.rotation.x = Math.PI / 2;
        orbit.position.y = -0.001; // Slightly below planets to avoid z-fighting
        scene.add(orbit);
      } else {
        // Sun at center
        model.position.set(0, 0, -0.8);
        
        // Add sun glow effect
        const sunGlowGeometry = new THREE.SphereGeometry(config.scale * 1.2, 32, 32);
        const sunGlowMaterial = new THREE.MeshBasicMaterial({
          color: 0xff9900,
          transparent: true,
          opacity: 0.3
        });
        const sunGlow = new THREE.Mesh(sunGlowGeometry, sunGlowMaterial);
        model.add(sunGlow);
      }
      
      scene.add(model);
      planetObjects.push({
        mesh: model,
        angle: planetData.angle,
        config: config
      });
    });

    // === Stars (Background) ===
    const starGeometry = new THREE.BufferGeometry();
    const starCount = 1000;
    const positions = new Float32Array(starCount * 3);
    
    for (let i = 0; i < starCount * 3; i += 3) {
      positions[i] = (Math.random() - 0.5) * 10;
      positions[i + 1] = (Math.random() - 0.5) * 10;
      positions[i + 2] = (Math.random() - 0.5) * 10;
    }
    
    starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    
    const starMaterial = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.02,
      transparent: true
    });
    
    const stars = new THREE.Points(starGeometry, starMaterial);
    scene.add(stars);

    return { planetObjects, stars };
  }

  // Lighting
  const ambientLight = new THREE.AmbientLight(0x333333);
  scene.add(ambientLight);

  const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
  directionalLight.position.set(5, 3, 5);
  scene.add(directionalLight);

  // Create galaxy after a short delay to ensure models are loaded
  let galaxy;
  const checkAndCreateGalaxy = setInterval(() => {
    if (planetModels.length === planets.length) {
      galaxy = createGalaxy();
      clearInterval(checkAndCreateGalaxy);
    }
  }, 100);

  // Animation
  renderer.setAnimationLoop(() => {
    if (galaxy) {
      // Animate planets
      galaxy.planetObjects.forEach((planet) => {
        const config = planet.config;
        
        if (config.name === 'sun') {
          // Rotate sun
          planet.mesh.rotation.y += config.rotationSpeed;
        } else {
          // Orbit planets around sun
          planet.angle += config.speed;
          planet.mesh.position.x = Math.cos(planet.angle) * config.distance;
          planet.mesh.position.z = Math.sin(planet.angle) * config.distance - 0.8;
          
          // Rotate planet on its axis
          planet.mesh.rotation.y += config.rotationSpeed;
        }
      });
      
      // Rotate stars slowly
      if (galaxy.stars) {
        galaxy.stars.rotation.y += 0.0005;
      }
    }
    
    renderer.render(scene, camera);
  });

  // Handle window resize
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
