<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AR Galaxy</title>
  <style>
    body { 
      margin: 0; 
      overflow: hidden; 
      background-color: #000;
    }
    canvas { 
      display: block; 
    }
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: Arial, sans-serif;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="loading">Loading AR Galaxy...</div>
<script type="module">
  import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165/build/three.module.js';
  import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.165/examples/jsm/webxr/ARButton.js';
  import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.165/examples/jsm/loaders/GLTFLoader.js';

  // Scene + Camera
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera();

  // Renderer
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  // Remove loading text
  document.querySelector('.loading').remove();

  // AR Button
  document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

  // GLTF Loader
  const loader = new GLTFLoader();

  // Create galaxy elements
  async function createGalaxy() {
    // === Central Star (Sun) ===
    const sunGeometry = new THREE.SphereGeometry(0.15, 64, 64);
    const sunMaterial = new THREE.MeshBasicMaterial({ 
      color: 0xffcc00,
      emissive: 0xffaa00,
      emissiveIntensity: 0.8
    });
    const sun = new THREE.Mesh(sunGeometry, sunMaterial);
    sun.position.set(0, 0, -0.8);
    scene.add(sun);

    // Add glow effect to sun
    const sunGlowGeometry = new THREE.SphereGeometry(0.18, 32, 32);
    const sunGlowMaterial = new THREE.MeshBasicMaterial({
      color: 0xff9900,
      transparent: true,
      opacity: 0.3
    });
    const sunGlow = new THREE.Mesh(sunGlowGeometry, sunGlowMaterial);
    sun.add(sunGlow);

    // === Planets ===
    // Daftar planet dengan model GLB yang akan dimuat
    const planets = [
      { 
        name: 'Mercury', 
        modelPath: 'models/mercury.glb', // Ganti dengan path model Mercury GLB Anda
        scale: 0.03, 
        distance: 0.25, 
        speed: 0.02 
      },
      { 
        name: 'Venus', 
        modelPath: 'models/venus.glb', // Ganti dengan path model Venus GLB Anda
        scale: 0.05, 
        distance: 0.4, 
        speed: 0.015 
      },
      { 
        name: 'Earth', 
        modelPath: 'models/earth.glb', // Ganti dengan path model Earth GLB Anda
        scale: 0.05, 
        distance: 0.55, 
        speed: 0.01 
      },
      { 
        name: 'Mars', 
        modelPath: 'models/mars.glb', // Ganti dengan path model Mars GLB Anda
        scale: 0.04, 
        distance: 0.7, 
        speed: 0.008 
      },
      { 
        name: 'Jupiter', 
        modelPath: 'models/jupiter.glb', // Ganti dengan path model Jupiter GLB Anda
        scale: 0.1, 
        distance: 0.9, 
        speed: 0.005 
      },
      { 
        name: 'Saturn', 
        modelPath: 'models/saturn.glb', // Ganti dengan path model Saturn GLB Anda
        scale: 0.09, 
        distance: 1.1, 
        speed: 0.003 
      }
    ];

    const planetMeshes = [];
    
    // Fungsi untuk memuat model GLB
    function loadPlanetModel(planetConfig) {
      return new Promise((resolve, reject) => {
        loader.load(
          planetConfig.modelPath,
          (gltf) => {
            const model = gltf.scene;
            
            // Skala model
            model.scale.setScalar(planetConfig.scale);
            
            // Position planet in orbit
            model.position.x = planetConfig.distance;
            
            // Tambahkan user data untuk animasi orbit
            model.userData = { 
              originalDistance: planetConfig.distance,
              speed: planetConfig.speed,
              angle: Math.random() * Math.PI * 2
            };
            
            // Pastikan model bisa dilihat dari semua sisi
            model.traverse((child) => {
              if (child.isMesh) {
                child.material.side = THREE.DoubleSide;
              }
            });
            
            scene.add(model);
            planetMeshes.push(model);
            resolve(model);
          },
          undefined,
          (error) => {
            console.error(`Error loading ${planetConfig.name}:`, error);
            
            // Fallback: buat sphere jika model GLB gagal dimuat
            const geometry = new THREE.SphereGeometry(planetConfig.scale, 32, 32);
            const material = new THREE.MeshStandardMaterial({ 
              color: getFallbackColor(planetConfig.name) 
            });
            const fallbackMesh = new THREE.Mesh(geometry, material);
            
            fallbackMesh.position.x = planetConfig.distance;
            fallbackMesh.userData = { 
              originalDistance: planetConfig.distance,
              speed: planetConfig.speed,
              angle: Math.random() * Math.PI * 2
            };
            
            scene.add(fallbackMesh);
            planetMeshes.push(fallbackMesh);
            resolve(fallbackMesh);
          }
        );
      });
    }
    
    // Fungsi untuk warna fallback jika model gagal dimuat
    function getFallbackColor(planetName) {
      const colors = {
        'Mercury': 0x8c8c8c,
        'Venus': 0xe6b87e,
        'Earth': 0x6b93d6,
        'Mars': 0xc1440e,
        'Jupiter': 0xc19e6b,
        'Saturn': 0xe3d2a6
      };
      return colors[planetName] || 0xffffff;
    }
    
    // Load semua model planet
    const loadPromises = planets.map(loadPlanetModel);
    await Promise.all(loadPromises);

    // === Stars (Background) ===
    const starGeometry = new THREE.BufferGeometry();
    const starCount = 1000;
    const positions = new Float32Array(starCount * 3);
    
    for (let i = 0; i < starCount * 3; i += 3) {
      positions[i] = (Math.random() - 0.5) * 10;     // x
      positions[i + 1] = (Math.random() - 0.5) * 10; // y
      positions[i + 2] = (Math.random() - 0.5) * 10; // z
    }
    
    starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    
    const starMaterial = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.02,
      transparent: true
    });
    
    const stars = new THREE.Points(starGeometry, starMaterial);
    scene.add(stars);

    // === Nebula Effect ===
    const nebulaGeometry = new THREE.SphereGeometry(1.5, 32, 32);
    const nebulaMaterial = new THREE.MeshBasicMaterial({
      color: 0x4a0b7a,
      transparent: true,
      opacity: 0.1,
      side: THREE.BackSide
    });
    const nebula = new THREE.Mesh(nebulaGeometry, nebulaMaterial);
    scene.add(nebula);

    return { sun, planetMeshes, stars };
  }

  // Lighting
  const ambientLight = new THREE.AmbientLight(0x333333);
  scene.add(ambientLight);

  const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
  directionalLight.position.set(5, 3, 5);
  scene.add(directionalLight);

  // Variables untuk menyimpan galaksi
  let galaxy;

  // Inisialisasi galaksi
  createGalaxy().then(g => {
    galaxy = g;
    
    // Start animation loop setelah semua model dimuat
    renderer.setAnimationLoop(() => {
      if (!galaxy) return;
      
      // Rotate sun
      galaxy.sun.rotation.y += 0.005;
      
      // Animate planets in orbit
      galaxy.planetMeshes.forEach(planet => {
        planet.userData.angle += planet.userData.speed;
        planet.position.x = Math.cos(planet.userData.angle) * planet.userData.originalDistance;
        planet.position.z = Math.sin(planet.userData.angle) * planet.userData.originalDistance - 0.8;
        
        // Rotasi planet pada sumbunya
        planet.rotation.y += 0.01;
      });
      
      // Rotate stars slowly
      galaxy.stars.rotation.y += 0.0005;
      
      renderer.render(scene, camera);
    });
  });

  // Handle window resize
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
